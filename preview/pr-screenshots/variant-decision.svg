<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660">
  <title>When to use labeled and glyph-only STIX icons</title>
  <rect width="1440" height="660" fill="#f6f8fa"/>
  <text x="72" y="72" fill="#1f2328" font-family="system-ui, sans-serif" font-size="36" font-weight="700">
    One icon system, treatments matched to context
  </text>
  <text x="72" y="112" fill="#59636e" font-family="system-ui, sans-serif" font-size="22">
    Persistent labels identify standalone artwork; native application text prevents duplication in interactive views.
  </text>

