    <circle cx="455" cy="221" r="68" fill="#f8fafc"
            stroke="#4338ca" stroke-width="3"/>
    <use x="407" y="173" width="96" height="96"
         href="#compose-artifact" color="#4338ca"/>

    <circle cx="506" cy="274" r="25"
            fill="#ffffff" stroke="#cbd5e1"/>
    <use x="488" y="256" width="36" height="36"
         href="#compose-defanged" color="#4338ca"/>
    <text x="455" y="338" text-anchor="middle"
          fill="#152033" font-family="system-ui, sans-serif"
          font-size="15" font-weight="700">Defanged Artifact</text>
    <text x="455" y="366" text-anchor="middle"
          fill="#67738a" font-family="system-ui, sans-serif"
          font-size="12">App supplies the accessible name</text>
  </g>
  <g>
    <rect x="622" y="122" width="246" height="270" rx="18"
          fill="#ffffff" stroke="#d9e0e9"/>
    <circle cx="745" cy="221" r="68" fill="#f8fafc"
            stroke="#9f1239" stroke-width="3"/>
    <use x="697" y="173" width="96" height="96"
         href="#compose-indicator" color="#9f1239"/>

    <circle cx="796" cy="274" r="25"
            fill="#ffffff" stroke="#cbd5e1"/>
    <use x="778" y="256" width="36" height="36"
         href="#compose-revoked" color="#9f1239"/>
    <text x="745" y="338" text-anchor="middle"
          fill="#152033" font-family="system-ui, sans-serif"
          font-size="15" font-weight="700">Revoked Indicator</text>
    <text x="745" y="366" text-anchor="middle"
          fill="#67738a" font-family="system-ui, sans-serif"
          font-size="12">App supplies the accessible name</text>
  </g>
  <g>
    <rect x="912" y="122" width="246" height="270" rx="18"
          fill="#ffffff" stroke="#d9e0e9"/>
    <circle cx="1035" cy="221" r="68" fill="#f8fafc"
            stroke="#374151" stroke-width="3"/>
    <use x="987" y="173" width="96" height="96"
         href="#compose-indicator" color="#374151"/>

    <circle cx="1086" cy="274" r="25"
            fill="#ffffff" stroke="#cbd5e1"/>
    <use x="1068" y="256" width="36" height="36"
         href="#compose-tlp-red" color="#374151"/>
    <text x="1035" y="338" text-anchor="middle"
          fill="#152033" font-family="system-ui, sans-serif"
          font-size="15" font-weight="700">Indicator marked TLP:RED</text>
    <text x="1035" y="366" text-anchor="middle"
          fill="#67738a" font-family="system-ui, sans-serif"
          font-size="12">App supplies the accessible name</text>
  </g>
</svg>
