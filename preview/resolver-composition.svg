    <text x="165" y="338" text-anchor="middle"
          fill="#152033" font-family="system-ui, sans-serif"
          font-size="15" font-weight="700">File with archive and NTFS</text>
    <text x="165" y="366" text-anchor="middle"
          fill="#67738a" font-family="system-ui, sans-serif"
          font-size="12">App supplies the accessible name</text>
  </g>
  <g>
    <rect x="332" y="122" width="246" height="270" rx="18"
