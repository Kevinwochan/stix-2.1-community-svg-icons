<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 440" role="img"
     aria-label="Examples of entity icons composed with semantic badges">
  <title>STIX semantic resolver composition examples</title>
  <defs>
    <symbol id="compose-file" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h20l11 11v37H17z"/>
  <path d="M37 8v11h11"/>
  <path d="M24 30h17M24 38h17M24 46h10"/>
  <circle cx="40" cy="46" r="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="compose-artifact" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><path d="m10 20 22-11 22 11-22 11zM10 20v26l22 10 22-10V20M32 31v25"/></symbol>
    <symbol id="compose-indicator" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="27" r="15"/>
  <path d="m39 38 14 14M18 29h5l3-7 5 13 3-6h5"/></symbol>
    <symbol id="compose-archive" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="14" width="44" height="11" rx="3"/>
  <path d="M14 25v25h36V25M25 34h14M27 42h10"/></symbol>
    <symbol id="compose-ntfs" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><path d="M14 10h25l11 11v33H14zM39 10v12h11"/>
  <circle cx="25" cy="33" r="3"/><circle cx="39" cy="42" r="3"/>
  <path d="M28 33h5c3 0 6 3 6 6"/></symbol>
    <symbol id="compose-defanged" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><path d="M15 11h34v18c0 14-7 22-17 27-10-5-17-13-17-27z"/>
  <path d="m23 25 5 12 4-8 4 8 5-12M11 53 53 11"/></symbol>
    <symbol id="compose-revoked" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="23"/><path d="m16 48 32-32"/></symbol>
    <symbol id="compose-tlp-red" viewBox="0 0 64 64"
      fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><path d="M7 16h28l21 16-21 16H7z"
        fill="#FF2B2B" stroke="#111827"/>
  <circle cx="17" cy="32" r="4" fill="#111827" stroke="none"/>
  <g fill="none" stroke="#111827" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="30" width="14" height="12" rx="2"/>
    <path d="M33 30v-4a4 4 0 0 1 8 0v4M37 35v3"/>
  </g></symbol>
  </defs>
  <rect width="1200" height="440" fill="#eef2f6"/>
  <text x="42" y="55" fill="#152033" font-family="system-ui, sans-serif"
        font-size="34" font-weight="750">Resolver composition examples</text>
  <text x="42" y="86" fill="#526078" font-family="system-ui, sans-serif"
        font-size="16">Base entity identity remains visible while semantic layers decorate it.</text>

  <g>
    <rect x="42" y="122" width="246" height="270" rx="18"
