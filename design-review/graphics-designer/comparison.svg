<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 980" role="img" aria-label="Current and proposed STIX icon comparison">
  <title>STIX icon simplification comparison</title>
  <defs>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#172033}.sub{font:16px system-ui,sans-serif;fill:#526078}
      .name{font:700 18px system-ui,sans-serif;fill:#172033}.cap{font:13px system-ui,sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#d8e0ea;stroke-width:2}.old{color:#8793a6}.new{color:#3659c9}
      .icon{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <symbol id="old-observed" viewBox="0 0 64 64"><path d="M6 32s10-17 26-17 26 17 26 17-10 17-26 17S6 32 6 32z"/><circle cx="32" cy="32" r="8"/><circle cx="29" cy="30" r="1.5" fill="currentColor" stroke="none"/><circle cx="35" cy="34" r="1.5" fill="currentColor" stroke="none"/></symbol>
