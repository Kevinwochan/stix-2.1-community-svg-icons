  <rect width="1540" height="980" fill="#eef2f6"/>
  <text x="40" y="55" class="title">Graphics-designer review: baseline → simplified</text>
  <text x="40" y="85" class="sub">Grey is the original baseline; blue is the simplified direction. Geometry shown at 64 px.</text>
