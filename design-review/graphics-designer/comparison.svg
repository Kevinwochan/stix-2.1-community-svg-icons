    <g transform="translate(540 390)"><rect width="460" height="240" rx="18" class="card"/><text x="24" y="35" class="name" stroke="none">Artifact</text><use href="#old-artifact" x="70" y="70" width="80" height="80" class="old"/><use href="#new-artifact" x="300" y="70" width="80" height="80" class="new"/><text x="82" y="180" class="cap" stroke="none">current</text><text x="292" y="180" class="cap" stroke="none">encoded payload</text></g>
